<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5da2"/>
      <stop offset="100%" stop-color="#5b2a9e"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc3d"/>
      <stop offset="100%" stop-color="#3ddc84"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- face -->
  <circle cx="512" cy="600" r="230" fill="#ffe0c2"/>
  <circle cx="430" cy="600" r="18" fill="#3a2a1a"/>
  <circle cx="594" cy="600" r="18" fill="#3a2a1a"/>
  <path d="M450 700 Q512 750 574 700" stroke="#3a2a1a" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- headband strap -->
  <path d="M282 470 Q512 330 742 470" stroke="url(#band)" stroke-width="46" fill="none" stroke-linecap="round"/>

  <!-- phone on forehead -->
  <g transform="translate(512 340) rotate(-6)">
    <rect x="-110" y="-150" width="220" height="300" rx="34" fill="#1b1033" stroke="#ffffff" stroke-width="10"/>
    <rect x="-84" y="-118" width="168" height="236" rx="14" fill="#ffffff"/>
    <text x="0" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="900" fill="#ff5da2" text-anchor="middle">?</text>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <circle cx="200" cy="250" r="14"/>
    <circle cx="820" cy="300" r="20"/>
    <circle cx="850" cy="700" r="14"/>
    <circle cx="170" cy="720" r="16"/>
  </g>
</svg>
